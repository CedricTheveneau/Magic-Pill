name: Publish new release to npm

on:
  release:
    types: [published]
  # Manual run: everything except the upload (`npm publish --dry-run`).
  # Note: npm refuses even a dry run if the version in package.json is already on npm.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC), no token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs because this job can mint
      # an npm publish credential (id-token: write). Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 (active LTS, same as .nvmrc) ships npm 11.20+,
          # above the npm >= 11.5.1 that Trusted Publishing needs
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # Never use caching in release builds

      - name: Show npm version
        run: npm --version

      # Scripts are skipped here because `npm publish` runs `prepare` (the build) itself
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build and dry-run publish
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run

      - name: Build and publish to npm
        if: github.event_name == 'release'
        run: npm publish
