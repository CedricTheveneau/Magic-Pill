name: Stage new release on npm

# Staged publishing: this workflow uploads the release to npm as a *staged*
# version, invisible to users. A maintainer then publishes it with 2FA:
#   npm stage list magic-pill
#   npm stage approve <stage-id>
# So nothing reaches users without a human with 2FA, even if this workflow
# or the GitHub account is compromised. The npm trusted publisher only allows
# `npm stage publish` (not `npm publish`).
#
# Pre-releases (e.g. 9.0.0-next.1) are staged under the `next` dist-tag.
# Create their GitHub release with the pre-release box ticked:
#   gh release create v9.0.0-next.1 --prerelease --target main …

on:
  release:
    types: [published]
  # Manual run: everything except the upload (`npm stage publish --dry-run`).
  # Note: npm refuses even a dry run if the version in package.json is already on npm.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC), no token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs because this job can mint
      # an npm publish credential (id-token: write). Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 (active LTS, same as .nvmrc) ships npm 11.20+, which has
          # `npm stage` and is above the npm >= 11.5.1 that Trusted Publishing needs
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # Never use caching in release builds

      - name: Show npm version
        run: npm --version

      # Scripts are skipped here because `npm stage publish` runs `prepare` (the build) itself
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Pre-release versions (9.0.0-next.1…) go to the `next` dist-tag, so
      # `latest` doesn't move; npm refuses a pre-release without --tag anyway.
      # On a release, the GitHub tag and its "pre-release" box must match package.json.
      - name: Pick the npm dist-tag
        id: dist-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next; prerelease=true ;;
            *) tag=latest; prerelease=false ;;
          esac
          if [ "$EVENT_NAME" = "release" ]; then
            if [ "$RELEASE_TAG" != "v$version" ]; then
              echo "::error::Release tag $RELEASE_TAG doesn't match package.json version $version (expected v$version)"
              exit 1
            fi
            if [ "$RELEASE_IS_PRERELEASE" != "$prerelease" ]; then
              echo "::error::The GitHub release's pre-release flag is $RELEASE_IS_PRERELEASE, but $version means $prerelease"
              exit 1
            fi
          fi
          echo "$version → dist-tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and dry-run stage
        if: github.event_name == 'workflow_dispatch'
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm stage publish --dry-run --tag "$DIST_TAG"

      - name: Build and stage on npm (approve with 2FA to publish)
        if: github.event_name == 'release'
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm stage publish --provenance --tag "$DIST_TAG"
