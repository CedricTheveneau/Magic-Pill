name: Demo

# Lints and builds the demo (magic-pill-demo/) on pull requests, and deploys
# it to GitHub Pages on main. Its migration page renders MIGRATING.md, so a
# change there redeploys it too. The deployment uses GitHub Pages' own Actions
# artifact (free on public repos): nothing is pushed to a gh-pages branch.
# It needs the repo's Pages source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['magic-pill-demo/**', 'MIGRATING.md', '.github/workflows/pages.yml', '.nvmrc']
  pull_request:
    paths: ['magic-pill-demo/**', 'MIGRATING.md', '.github/workflows/pages.yml', '.nvmrc']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build the demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magic-pill-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: magic-pill-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Static export to out/, with Turbopack (Next.js 16's default)
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: magic-pill-demo/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment halfway
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
