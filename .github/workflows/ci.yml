name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22: maintenance LTS (until 2027-04-30). 24: maintenance LTS.
        # 26: active LTS, used by .nvmrc and publish.yml
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          for f in dist/index.js dist/index.mjs dist/index.d.ts dist/index.d.mts dist/styles.css dist/themes.css dist/forms.css; do
            test -f "$f" || { echo "::error::Missing build output: $f"; exit 1; }
          done
          # Components with state must keep their "use client" directive (Server Component support)
          for f in MagicPill/MagicPill Pill/Pill Pill/PillContext Pill/PillPanel Pill/modal Pill/morph Pill/themed Pill/zone PillNavbar/PillNavbar PillNavbar/room PillForm/PillForm PillForm/PillField PillForm/PillInput PillForm/PillTextarea PillForm/PillSelect PillForm/PillSlider PillForm/PillSwitch PillForm/PillCheckbox PillForm/PillChoices PillForm/PillStepper PillForm/PillCode PillForm/PillFile PillForm/PillColor PillForm/validity PillForm/keyboard PillOptics/PillOptics store/usePillQueue; do
            for ext in js mjs; do
              test "$(head -c 13 "dist/$f.$ext")" = '"use client";' || { echo "::error::dist/$f.$ext doesn't start with \"use client\""; exit 1; }
            done
          done
          # Stateless modules must not have it, or Server Components would get client references
          for f in Pill/parts Pill/PillAction PillNotification/PillNotification PillNavbar/matchPath store/store MagicPill/choreography PillForm/glyphs PillForm/PillFields PillOptics/lens icons/CheckIcon utils/url utils/timing; do
            for ext in js mjs; do
              ! grep -q '"use client"' "dist/$f.$ext" || { echo "::error::dist/$f.$ext must stay server-safe (no \"use client\")"; exit 1; }
            done
          done
          for f in styles.css themes.css forms.css; do
            cmp -s "src/$f" "dist/$f" || { echo "::error::dist/$f differs from src/$f"; exit 1; }
          done

      # What an app ships when it uses Magic Pill, gzipped (scripts/size.mjs holds the budgets)
      - name: Check size budget
        run: npm run size

  audit:
    # Library only: the demo is a static export, with no server running
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reads package-lock.json, no install needed
      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high
